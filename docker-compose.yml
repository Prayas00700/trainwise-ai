# Prototype note: the API and dashboard each host an in-process platform (separate telemetry).
# In production both would share an event bus, feature store and model registry.
# The Prometheus and Grafana services scrape the API's /metrics endpoint (Bearer demo-ops-key).
services:
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      - TRAINWISE_API_KEYS=${TRAINWISE_API_KEYS:-passenger:demo-passenger-key,ops:demo-ops-key,admin:demo-admin-key}
  dashboard:
    build: .
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports: ["8501:8501"]
  prometheus:
    image: prom/prometheus:latest
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:latest
    environment: ["GF_SECURITY_ADMIN_PASSWORD=admin"]
    volumes: ["./ops/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"]
    ports: ["3000:3000"]
    depends_on: [prometheus]
